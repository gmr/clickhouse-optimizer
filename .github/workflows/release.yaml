name: Release to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
